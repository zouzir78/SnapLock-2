name: Build SnapLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -o SnapLockAndroid_source_fixed.zip -d extracted
          find extracted -type f -name gradlew

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Fichier gradlew introuvable dans le ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          chmod +x gradlew
          sed -i 's/\r$//' gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SnapLock-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
