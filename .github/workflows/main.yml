
name: Build SnapLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o SnapLockAndroid_source_fixed.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/SnapLockAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapLock-APK
          path: extracted/SnapLockAndroid/app/build/outputs/apk/debug/*.apk
