name: Build SnapLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o SnapLockAndroid_source_fixed.zip -d extracted
          find extracted -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd extracted/SnapLockAndroid
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapLock-APK
          path: extracted/SnapLockAndroid/app/build/outputs/apk/debug/*.apk
